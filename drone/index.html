<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLYZONE — HUR-UAV-01</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/flyzone-icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a1526; background-image: radial-gradient(900px 480px at 80% 0%, rgba(41,182,232,.18), transparent 60%);
    font-family: 'Inter', 'Cairo', 'Tahoma', sans-serif; color: #eaf3fb; padding: 24px;
  }
  .card { text-align: center; max-width: 420px; }
  img.logo { height: 56px; margin-bottom: 28px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .04em; color: #93a8c2; margin: 0 0 22px; text-transform: uppercase; }
  .langs { display: flex; flex-direction: column; gap: 12px; }
  .langs a {
    display: flex; align-items: center; justify-content: space-between; text-decoration: none;
    padding: 16px 20px; border-radius: 14px; border: 1px solid rgba(143,220,245,.2);
    background: rgba(255,255,255,.03); color: #eaf3fb; font-weight: 700; font-size: 16px;
    transition: border-color .2s ease, background .2s ease;
  }
  .langs a:hover { border-color: #55c9ef; background: rgba(85,201,239,.08); }
  .langs a span.native { font-weight: 800; }
  .langs a span.code { font-size: 12px; color: #55c9ef; letter-spacing: .08em; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/img/flyzone-logo.png" alt="FLYZONE">
    <h1>Choose your language / اختر اللغة / Dil seçin</h1>
    <div class="langs">
      <a href="ar.html"><span class="native">العربية</span><span class="code">AR</span></a>
      <a href="tr.html"><span class="native">Türkçe</span><span class="code">TR</span></a>
      <a href="en.html"><span class="native">English</span><span class="code">EN</span></a>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get("stay") === "1") return;
      var lang = (navigator.language || "en").toLowerCase();
      var target = lang.startsWith("ar") ? "ar.html" : lang.startsWith("tr") ? "tr.html" : null;
      if (target) window.location.replace(target);
    })();
  </script>
</body>
</html>
